services:
  # Node.js/Express Backend
  - type: web
    name: soc-platform-backend
    env: node
    plan: free
    buildCommand: "npm install"
    startCommand: "npm run start"
    envVars:
      - key: NODE_VERSION
        value: ~20
      - key: PORT
        value: 10000

  # Vite React Frontend
  - type: web
    name: soc-platform-frontend
    env: static
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: "./dist"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: soc-platform-backend
          envVarKey: RENDER_EXTERNAL_URL
